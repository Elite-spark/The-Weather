<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة Elite Spark - الطقس والتحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">       
       
    <style>   
        
        :root {
            --gold-glow: #FFD700;
            --glow-opacity: rgba(255, 215, 0, 0.5);
            --background-color: #000;
            --text-color: #F0F0F0;
            --sidebar-width: 280px;
            --primary-color: #FFD700;
            --secondary-color: #000;
            --accent-color: #8B7500;
        }
       
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #F0F0F0;
            overflow-x: hidden;
        }

        .logo {
            direction: ltr;
            text-align: right;
            font-weight: bold;
            font-size: 0.8em;
            font-family: 'Roboto', sans-serif;
            color: var(--gold-glow);
            margin: 0px;
            margin-right: 30px;
            bottom: 10px;
            text-shadow: 1px 1px 5px var(--glow-opacity);
            animation: fadeInUp 0.8s ease-in-out;
        }

        .elite1-time-container {
            text-align: center;
            width: 95%;
            padding: 15px;
            font-family: 'Orbitron', 'Roboto', sans-serif;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 0px solid var(--gold-glow);
            position: relative;
            margin-top: 40px;
            margin: 0px;
            
        }
        .elite-time-container {
            text-align: center;
            width: 97%; 
            padding: 5px;
            padding-top: 30px;
            font-family: 'Orbitron', 'Roboto', sans-serif;
            color: var(--gold-glow);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 0px solid var(--gold-glow);
            border-left: 1px solid var(--gold-glow);
            box-shadow: 0 0 20px var(--glow-opacity);
            position: relative;
            overflow: hidden;
            margin-top: 15px;
            margin: 5px;
            
        }

        .elite-time-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold-glow), 
                transparent);
            animation: scanline 3s linear infinite;
        }

                /* مؤشرات حية */
        .time-indicators {
            position: absolute;
            margin-bottom: 30px;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-glow);
            box-shadow: 0 0 10px #00ff00;
            animation: indicatorPulse 1.5s infinite;
        }

        .indicator-dot:nth-child(2) {
            background: var(--gold-glow);
            animation-delay: 0.3s;
        }

                /* حركات */
        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes indicatorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

    </style>
</head>
<body>
  <div class="elite-time-container">
    <div class="time-indicators">
      <div class="indicator-dot"></div>
      <div class="indicator-dot"></div>
      <div class="indicator-dot"></div>
    </div>

    <div class="elite1-time-container">
      <a class="weatherwidget-io" href="https://forecast7.com/en/36d2144d01/erbil/" data-label_1="ERBIL" data-label_2="WEATHER" data-font="Trebuchet MS" data-icons="Climacons Animated" data-days="5" data-theme="weather_one" >ERBIL WEATHER</a>
      <script>
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
      </script>
    </div>
  </div>
  <div class="logo">Elite Spark  --2026-- @</div>

<script>

    // وظيفة تحديث اللون من تطبيق MIT App Inventor
    function updateThemeColor() {
        try {
            // جلب اللون من WebViewString (سيرسل التطبيق مثلاً #40e0d0)
            let newColor = window.AppInventor.getWebViewString();
            
            if (newColor && newColor.length > 3) {
                document.documentElement.style.setProperty('--gold-glow', newColor);
                // تحديث الشفافية للتوهج
                let glowColor = newColor + "4D"; // إضافة شفافية 30%
                document.documentElement.style.setProperty('--glow-opacity', glowColor);
            }
        } catch (e) {
            // في حال المتصفح العادي لا يفعل شيئاً
        }
    }
    // تشغيل الدالة كل 1000 ملي ثانية (نصف ثانية) لضمان الاستجابة السريعة
    setInterval(updateThemeColor, 1000);
    updateThemeColor();
  </script>
</body>
</html>
